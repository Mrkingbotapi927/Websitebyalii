<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Login — TeleHost</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#03070a; --s1:#060f15; --s2:#0a1820; --border:#0d2535; --accent:#00e5ff; --accent2:#00ff88; --text:#b8d4e0; --muted:#3a6070; --white:#e8f4f8; }
body { font-family:'JetBrains Mono',monospace; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
.grid-bg { position:fixed; inset:0; background-image:linear-gradient(rgba(0,229,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.04) 1px,transparent 1px); background-size:32px 32px; pointer-events:none; z-index:0; }
nav { position:relative; z-index:10; display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); background:rgba(6,15,21,0.9); }
.logo { font-family:'Orbitron',sans-serif; font-weight:900; font-size:18px; color:var(--accent); letter-spacing:2px; text-decoration:none; }
.logo span { color:var(--accent2); }
.main { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }
.card { width:100%; max-width:380px; background:var(--s1); border:1px solid var(--border); border-radius:12px; padding:28px 24px; animation:fadeUp 0.5s ease-out; }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.card-title { font-family:'Orbitron',sans-serif; font-size:18px; color:var(--white); margin-bottom:6px; }
.card-sub { font-size:11px; color:var(--muted); margin-bottom:28px; }
.input-group { margin-bottom:16px; }
.input-label { font-size:11px; color:var(--muted); letter-spacing:1px; margin-bottom:6px; display:block; }
.input-wrap { position:relative; }
.input-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; }
input { width:100%; padding:12px 12px 12px 38px; background:var(--s2); border:1px solid var(--border); border-radius:6px; color:var(--white); font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; transition:all 0.2s; }
input:focus { border-color:var(--accent); box-shadow:0 0 15px rgba(0,229,255,0.1); }
input::placeholder { color:var(--muted); }
.alert { padding:12px; border-radius:6px; font-size:12px; margin-bottom:16px; display:none; }
.alert.error { background:rgba(255,71,87,0.1); border:1px solid rgba(255,71,87,0.3); color:#ff4757; }
.alert.success { background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.3); color:var(--accent2); }
.btn { width:100%; padding:14px; background:linear-gradient(135deg,rgba(0,229,255,0.15),rgba(0,255,136,0.1)); border:1px solid var(--accent); color:var(--accent); font-family:'Orbitron',sans-serif; font-size:12px; letter-spacing:2px; border-radius:6px; cursor:pointer; transition:all 0.3s; margin-bottom:16px; }
.btn:hover { box-shadow:0 0 25px rgba(0,229,255,0.2); transform:translateY(-1px); }
.link-text { display:block; text-align:center; font-size:12px; color:var(--muted); }
.link-text a { color:var(--accent); text-decoration:none; }
.spin { display:inline-block; animation:spin 1s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="grid-bg"></div>
<nav><a href="index.html" class="logo">TELE<span>HOST</span></a></nav>
<div class="main">
  <div class="card">
    <div class="card-title">Welcome Back</div>
    <div class="card-sub">// Login to manage your bots</div>
    <div class="alert" id="alert"></div>
    <div class="input-group">
      <label class="input-label">USERNAME</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="your_username">
      </div>
    </div>
    <div class="input-group">
      <label class="input-label">PASSWORD</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Your password" onkeydown="if(event.key==='Enter')login()">
      </div>
    </div>
    <button class="btn" id="btn" onclick="login()">LOGIN →</button>
    <div class="link-text">No account? <a href="register.html">Register here</a></div>
  </div>
</div>
<script>
const session = JSON.parse(localStorage.getItem('telehost_session')||'{}');
if(session.loggedIn) window.location.href='dashboard.html';
function showAlert(msg,type){ const el=document.getElementById('alert'); el.textContent=msg; el.className='alert '+type; el.style.display='block'; }
function login(){
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  const btn=document.getElementById('btn');
  if(!u||!p) return showAlert('⚠️ Fill all fields','error');
  btn.disabled=true; btn.innerHTML='<span class="spin">⟳</span> LOGGING IN...';
  setTimeout(()=>{
    const users=JSON.parse(localStorage.getItem('telehost_users')||'[]');
    const user=users.find(u2=>u2.username===u&&u2.password===p);
    if(!user){ showAlert('⚠️ Wrong username or password','error'); btn.disabled=false; btn.innerHTML='LOGIN →'; return; }
    localStorage.setItem('telehost_session',JSON.stringify({username:u,loggedIn:true}));
    showAlert('✅ Login successful!','success');
    setTimeout(()=>{ window.location.href='dashboard.html'; },1000);
  },1200);
}
</script>
</body>
</html>
