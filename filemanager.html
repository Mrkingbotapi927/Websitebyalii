<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>File Manager — TeleHost</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #03070a; --s1: #060f15; --s2: #0a1820; --border: #0d2535; --accent: #00e5ff; --accent2: #00ff88; --accent3: #ff6b35; --danger: #ff4757; --text: #b8d4e0; --muted: #3a6070; --white: #e8f4f8; }
body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }
.grid-bg { position: fixed; inset: 0; background-image: linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px); background-size: 32px 32px; pointer-events: none; z-index: 0; }
nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: rgba(3,7,10,0.95); }
.logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 16px; color: var(--accent); letter-spacing: 2px; text-decoration: none; }
.logo span { color: var(--accent2); }
.back-btn { padding: 7px 14px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 11px; border-radius: 4px; cursor: pointer; text-decoration: none; }
.page { position: relative; z-index: 1; padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 120px; }
.page-title { font-family: 'Orbitron', sans-serif; font-size: 16px; color: var(--white); margin-bottom: 4px; }
.page-sub { font-size: 11px; color: var(--muted); margin-bottom: 24px; }
.upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; background: var(--s1); position: relative; }
.upload-zone:hover { border-color: var(--accent); background: rgba(0,229,255,0.03); }
.upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-icon { font-size: 40px; margin-bottom: 12px; }
.upload-title { font-size: 14px; color: var(--white); margin-bottom: 6px; }
.upload-sub { font-size: 11px; color: var(--muted); line-height: 1.6; }
.upload-types { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.type-badge { padding: 3px 10px; border-radius: 20px; font-size: 10px; letter-spacing: 1px; }
.type-badge.py { border: 1px solid #3776ab; color: #3776ab; }
.type-badge.js { border: 1px solid #f7df1e; color: #f7df1e; }
.section-title { font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.file-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.file-item { background: var(--s1); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; cursor: pointer; }
.file-item:hover { border-color: var(--accent); }
.file-item.selected { border-color: var(--accent2); background: rgba(0,255,136,0.04); }
.file-icon { font-size: 22px; flex-shrink: 0; }
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 13px; color: var(--white); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-meta { font-size: 10px; color: var(--muted); }
.file-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; }
.file-del:hover { color: var(--danger); }
.file-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; }
.file-item.selected .file-check { background: var(--accent2); border-color: var(--accent2); color: #000; }
.empty-files { text-align: center; padding: 30px; color: var(--muted); font-size: 12px; line-height: 1.8; }
.run-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--s1); border-top: 1px solid var(--accent2); padding: 16px 20px; z-index: 200; transform: translateY(100%); transition: transform 0.3s ease; }
.run-panel.show { transform: translateY(0); }
.run-panel-inner { max-width: 600px; margin: 0 auto; }
.selected-file { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sel-name { font-size: 13px; color: var(--white); }
.sel-lang { font-size: 10px; color: var(--muted); }
.run-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.btn-cancel { padding: 14px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 12px; border-radius: 6px; cursor: pointer; }
.btn-run { padding: 14px; background: linear-gradient(135deg, rgba(0,255,136,0.2), rgba(0,229,255,0.1)); border: 1px solid var(--accent2); color: var(--accent2); font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 2px; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
.btn-run:hover { box-shadow: 0 0 20px rgba(0,255,136,0.3); }
.progress-overlay { position: fixed; inset: 0; background: rgba(3,7,10,0.95); z-index: 300; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.progress-overlay.show { display: flex; }
.prog-title { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--accent); }
.prog-bar { width: 260px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.5s ease; }
.prog-steps { display: flex; flex-direction: column; gap: 8px; width: 280px; }
.prog-item { font-size: 12px; display: flex; align-items: center; gap: 8px; color: var(--muted); }
.prog-item.done { color: var(--accent2); }
.prog-item.active { color: var(--accent); }
.spinner { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="grid-bg"></div>
<nav>
  <a href="index.html" class="logo">TELE<span>HOST</span></a>
  <a href="dashboard.html" class="back-btn">← DASHBOARD</a>
</nav>
<div class="page">
  <div class="page-title">📁 File Manager</div>
  <div class="page-sub">// Upload your bot script and run it</div>
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept=".py,.js" onchange="handleFile(this)">
    <div class="upload-icon">📤</div>
    <div class="upload-title">Tap to Upload Script</div>
    <div class="upload-sub">Drag & drop or tap to select file</div>
    <div class="upload-types">
      <span class="type-badge py">🐍 .py Python</span>
      <span class="type-badge js">⚡ .js Node.js</span>
    </div>
  </div>
  <div class="section-title">UPLOADED FILES</div>
  <div class="file-list" id="fileList"></div>
</div>
<div class="run-panel" id="runPanel">
  <div class="run-panel-inner">
    <div class="selected-file">
      <div style="font-size:20px" id="selIcon">🐍</div>
      <div><div class="sel-name" id="selName">bot.py</div><div class="sel-lang" id="selLang">Python 3.11</div></div>
    </div>
    <div class="run-actions">
      <button class="btn-cancel" onclick="deselect()">CANCEL</button>
      <button class="btn-run" onclick="runBot()">▶ RUN BOT</button>
    </div>
  </div>
</div>
<div class="progress-overlay" id="progressOverlay">
  <div class="prog-title">DEPLOYING BOT</div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-steps" id="progSteps">
    <div class="prog-item" id="step1">⬜ Uploading script...</div>
    <div class="prog-item" id="step2">⬜ Detecting language...</div>
    <div class="prog-item" id="step3">⬜ Installing dependencies...</div>
    <div class="prog-item" id="step4">⬜ Starting bot...</div>
  </div>
</div>
<script>
const session = JSON.parse(localStorage.getItem('telehost_session') || '{}');
if (!session.loggedIn) window.location.href = 'login.html';
let files = JSON.parse(localStorage.getItem('telehost_files_' + session.username) || '[]');
let selectedFile = null;
function renderFiles() {
  const list = document.getElementById('fileList');
  if (files.length === 0) { list.innerHTML = '<div class="empty-files">No files uploaded yet.<br>Upload your bot script above.</div>'; return; }
  list.innerHTML = '';
  files.forEach((f, i) => {
    const isPy = f.name.endsWith('.py');
    const div = document.createElement('div');
    div.className = 'file-item' + (selectedFile === i ? ' selected' : '');
    div.innerHTML = '<div class="file-icon">' + (isPy ? '🐍' : '⚡') + '</div><div class="file-info"><div class="file-name">' + f.name + '</div><div class="file-meta">' + (isPy ? 'Python' : 'Node.js') + ' · ' + f.size + ' · ' + f.date + '</div></div><button class="file-del" onclick="delFile(event,' + i + ')">🗑</button><div class="file-check">' + (selectedFile === i ? '✓' : '') + '</div>';
    div.onclick = () => selectFile(i);
    list.appendChild(div);
  });
}
function delFile(e, i) {
  e.stopPropagation();
  files.splice(i, 1);
  localStorage.setItem('telehost_files_' + session.username, JSON.stringify(files));
  if (selectedFile === i) deselect();
  else renderFiles();
}
function selectFile(i) {
  selectedFile = i;
  const f = files[i];
  const isPy = f.name.endsWith('.py');
  document.getElementById('selIcon').textContent = isPy ? '🐍' : '⚡';
  document.getElementById('selName').textContent = f.name;
  document.getElementById('selLang').textContent = isPy ? 'Python 3.11' : 'Node.js 18';
  document.getElementById('runPanel').classList.add('show');
  renderFiles();
}
function deselect() {
  selectedFile = null;
  document.getElementById('runPanel').classList.remove('show');
  renderFiles();
}
function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.name.endsWith('.py') && !file.name.endsWith('.js')) { alert('Only .py and .js files allowed!'); return; }
  const size = file.size < 1024 ? file.size + ' B' : Math.round(file.size/1024) + ' KB';
  files.push({ name: file.name, size, date: new Date().toLocaleDateString() });
  localStorage.setItem('telehost_files_' + session.username, JSON.stringify(files));
  renderFiles();
}
function setStep(id, state, txt) {
  const el = document.getElementById(id);
  if (state === 'active') { el.className = 'prog-item active'; el.innerHTML = '<span class="spinner">⟳</span> ' + txt; }
  else if (state === 'done') { el.className = 'prog-item done'; el.textContent = '✅ ' + txt; }
}
function runBot() {
  if (selectedFile === null) return;
  const f = files[selectedFile];
  const isPy = f.name.endsWith('.py');
  document.getElementById('progressOverlay').classList.add('show');
  document.getElementById('progFill').style.width = '0%';
  const steps = [['Uploading script...','25%'],['Detecting language: '+(isPy?'Python 3.11':'Node.js 18'),'50%'],['Installing dependencies...','75%'],['Starting bot...','100%']];
  let i = 0;
  const ids = ['step1','step2','step3','step4'];
  ids.forEach((id,idx) => { document.getElementById(id).className='prog-item'; document.getElementById(id).textContent='⬜ '+steps[idx][0]; });
  const iv = setInterval(() => {
    if (i > 0) setStep(ids[i-1], 'done', steps[i-1][0]);
    if (i < steps.length) { setStep(ids[i], 'active', steps[i][0]); document.getElementById('progFill').style.width = steps[i][1]; i++; }
    else {
      clearInterval(iv);
      const botState = { running: true, filename: f.name, lang: isPy ? 'Python' : 'Node.js', ram: Math.floor(80+Math.random()*80), startTime: Date.now(), restarts: 0 };
      localStorage.setItem('telehost_bot_' + session.username, JSON.stringify(botState));
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
    }
  }, 900);
}
renderFiles();
</script>
</body>
</html>
